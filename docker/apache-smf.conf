ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

<Directory "/var/www/html">
	Options -Indexes +FollowSymLinks
	AllowOverride None
	Require all granted

	RewriteEngine On
	RewriteCond /var/www/smf-config/installer-enabled !-f
	RewriteRule ^(?:install|upgrade)\.php$ - [F,L,NC]
</Directory>

<Directory "/var/www/html/attachments">
	Require all denied
</Directory>

<Directory "/var/www/html/cache">
	Require all denied
</Directory>

<Directory "/var/www/html/Packages">
	Require all denied
</Directory>

<FilesMatch "^(?:Settings(?:_bak)?\.php|composer\.(?:json|lock)|\.env)$">
	Require all denied
</FilesMatch>

<IfModule mod_headers.c>
	Header always unset X-Powered-By
	Header always set X-Content-Type-Options "nosniff"
	Header always set X-Frame-Options "SAMEORIGIN"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
