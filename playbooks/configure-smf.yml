---
# Reconfigure an existing SMF deployment without rerunning install.php.
- name: Reconfigure SMF exposure and public URL
  hosts: "{{ TARGET_HOSTS | default('smf') }}"
  become: true
  gather_facts: false

  vars:
    APP_NAME: smf
    APP_USER: "{{ APP_NAME }}"
    APP_GROUP: "{{ APP_NAME }}"
    SMF_BASE_PATH: "/opt/{{ APP_NAME }}"
    SMF_COMPOSE_PATH: "{{ SMF_BASE_PATH }}/docker-compose.yml"
    SMF_COMPOSE_OVERRIDE_PATH: "{{ SMF_BASE_PATH }}/docker-compose.smf.override.yml"
    SMF_PUBLISHED_PORT: ""
    SMF_FORUM_URL: ""

  pre_tasks:
    - name: Validate SMF configuration variables
      ansible.builtin.assert:
        that:
          - >-
            (SMF_PUBLISHED_PORT | string | length == 0) or
            (
              (SMF_PUBLISHED_PORT | string) is match('^[1-9][0-9]{0,4}$') and
              (SMF_PUBLISHED_PORT | int) <= 65535
            )
          - SMF_FORUM_URL is match('^https?://[^/?#\\s]+(?:/[^?#\\s]+)?$')
        fail_msg: >-
          Set SMF_PUBLISHED_PORT to an empty value or a TCP port from 1 through
          65535, and set SMF_FORUM_URL to an http or https URL without a trailing
          slash, query, or fragment.

    - name: Verify Docker Engine availability
      ansible.builtin.command:
        argv:
          - docker
          - version
      changed_when: false

    - name: Read Docker Compose plugin version
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - version
          - --short
      register: smf_compose_version
      changed_when: false

    - name: Require Docker Compose override support
      ansible.builtin.assert:
        that:
          - >-
            (smf_compose_version.stdout
             | regex_replace('^[^0-9]*', '')
             | regex_replace('[^0-9.].*$', '')) is version('2.24.4', '>=')
        fail_msg: >-
          SMF configuration requires Docker Compose 2.24.4 or newer so its
          managed override can replace a previous host port safely.

    - name: Inspect deployed SMF Compose files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ SMF_COMPOSE_PATH }}"
        - "{{ SMF_COMPOSE_OVERRIDE_PATH }}"
      register: smf_compose_file_stats

    - name: Require an existing SMF deployment
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: >-
          SMF is not deployed at {{ SMF_BASE_PATH }}. Run smf install before
          using smf configure.
      loop: "{{ smf_compose_file_stats.results }}"

    - name: Resolve the current SMF deployment image from Compose
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --file
          - "{{ SMF_COMPOSE_PATH }}"
          - --file
          - "{{ SMF_COMPOSE_OVERRIDE_PATH }}"
          - config
          - --format
          - json
        chdir: "{{ SMF_BASE_PATH }}"
      register: smf_current_compose_configuration
      changed_when: false

    - name: Record the current SMF deployment image
      ansible.builtin.set_fact:
        smf_current_deployment_image: >-
          {{ (smf_current_compose_configuration.stdout | from_json).services.smf.image | default('') }}

    - name: Require an image in the current SMF Compose configuration
      ansible.builtin.assert:
        that:
          - smf_current_deployment_image | length > 0
        fail_msg: >-
          The deployed SMF Compose configuration does not define an image for
          the smf service.

    - name: Verify the persisted SMF settings target is safely writable
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --file
          - "{{ SMF_COMPOSE_PATH }}"
          - --file
          - "{{ SMF_COMPOSE_OVERRIDE_PATH }}"
          - exec
          - -T
          - smf
          - php
          - -r
          - |
            $settingsPath = realpath('/var/www/html/Settings.php');
            if (
                $settingsPath === false ||
                dirname($settingsPath) !== '/var/www/smf-config' ||
                !is_file($settingsPath) ||
                !is_writable($settingsPath) ||
                !is_writable(dirname($settingsPath))
            ) {
                fwrite(STDERR, "The persisted Settings.php target is not writable by the SMF service.\n");
                exit(1);
            }
            $settingsLines = file($settingsPath);
            $boardURLLines = 0;
            foreach ($settingsLines as $settingsLine) {
                if (preg_match('/^\s*\$boardurl\s*=/', $settingsLine)) {
                    $boardURLLines++;
                }
            }
            if ($boardURLLines !== 1) {
                fwrite(STDERR, "Settings.php must contain exactly one \$boardurl assignment.\n");
                exit(1);
            }
        chdir: "{{ SMF_BASE_PATH }}"
      changed_when: false

  tasks:
    - name: Validate and install the selected SMF Compose override
      block:
        - name: Create a temporary SMF Compose override
          ansible.builtin.tempfile:
            state: file
            path: "{{ SMF_BASE_PATH }}"
            prefix: .docker-compose.smf.override.
            suffix: .yml
          register: smf_candidate_override

        - name: Render a candidate SMF Compose override with the selected exposure
          ansible.builtin.copy:
            content: |
              # Managed by configure-smf.yml. Do not edit manually.
              services:
                smf:
                  image: {{ smf_current_deployment_image | to_json }}
              {% if SMF_PUBLISHED_PORT | string | length > 0 %}
                  ports: !override
                    - "{{ SMF_PUBLISHED_PORT }}:80"
              {% else %}
                  ports: !reset []
              {% endif %}
            dest: "{{ smf_candidate_override.path }}"
            owner: root
            group: root
            mode: "0600"

        - name: Validate the candidate SMF Docker Compose configuration
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --file
              - "{{ SMF_COMPOSE_PATH }}"
              - --file
              - "{{ smf_candidate_override.path }}"
              - config
              - --quiet
            chdir: "{{ SMF_BASE_PATH }}"
          changed_when: false

        - name: Install the validated SMF Compose override
          ansible.builtin.copy:
            remote_src: true
            src: "{{ smf_candidate_override.path }}"
            dest: "{{ SMF_COMPOSE_OVERRIDE_PATH }}"
            owner: "{{ APP_USER }}"
            group: "{{ APP_GROUP }}"
            mode: "0600"
      always:
        - name: Remove the temporary SMF Compose override
          ansible.builtin.file:
            path: "{{ smf_candidate_override.path }}"
            state: absent
          when: smf_candidate_override.path is defined

    - name: Recreate the SMF service with the selected exposure
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --file
          - "{{ SMF_COMPOSE_PATH }}"
          - --file
          - "{{ SMF_COMPOSE_OVERRIDE_PATH }}"
          - up
          - --detach
          - --pull
          - never
          - --force-recreate
          - --no-deps
          - --wait
          - --wait-timeout
          - "180"
          - smf
        chdir: "{{ SMF_BASE_PATH }}"
      changed_when: true

    - name: Synchronize the persisted SMF URL configuration
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --file
          - "{{ SMF_COMPOSE_PATH }}"
          - --file
          - "{{ SMF_COMPOSE_OVERRIDE_PATH }}"
          - exec
          - -T
          - --env
          - "SMF_FORUM_URL={{ SMF_FORUM_URL }}"
          - smf
          - php
          - -r
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../scripts/configure-smf-url-settings.php') | regex_replace('^<\\?php\\s*', '') }}"
        chdir: "{{ SMF_BASE_PATH }}"
      register: smf_url_configuration_update
      changed_when: smf_url_configuration_update.stdout | trim != 'unchanged'

    - name: Verify the persisted SMF forum URL
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --file
          - "{{ SMF_COMPOSE_PATH }}"
          - --file
          - "{{ SMF_COMPOSE_OVERRIDE_PATH }}"
          - exec
          - -T
          - --env
          - "SMF_FORUM_URL={{ SMF_FORUM_URL }}"
          - smf
          - php
          - -r
          - |
            $settingsPath = realpath('/var/www/html/Settings.php');
            if ($settingsPath === false || dirname($settingsPath) !== '/var/www/smf-config') {
                fwrite(STDERR, "Could not resolve the persisted Settings.php target.\n");
                exit(1);
            }
            require $settingsPath;
            $forumURL = getenv('SMF_FORUM_URL');
            if (!isset($boardurl) || $boardurl !== $forumURL) {
                fwrite(STDERR, "Settings.php board URL does not match the requested URL.\n");
                exit(1);
            }
        chdir: "{{ SMF_BASE_PATH }}"
      changed_when: false

    - name: Query the SMF host port publication
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --file
          - "{{ SMF_COMPOSE_PATH }}"
          - --file
          - "{{ SMF_COMPOSE_OVERRIDE_PATH }}"
          - port
          - smf
          - "80"
        chdir: "{{ SMF_BASE_PATH }}"
      register: smf_published_port_query
      changed_when: false
      failed_when: false

    - name: Verify the selected SMF host port is published
      ansible.builtin.assert:
        that:
          - smf_published_port_query.rc == 0
          - >-
            (smf_published_port_query.stdout_lines
             | select('match', '.*:' ~ (SMF_PUBLISHED_PORT | string) ~ '$')
             | list | length) > 0
        fail_msg: >-
          SMF did not publish host port {{ SMF_PUBLISHED_PORT }} to its
          container port 80.
      when: SMF_PUBLISHED_PORT | string | length > 0

    - name: Verify SMF has no published host port
      ansible.builtin.assert:
        that:
          - smf_published_port_query.rc != 0
        fail_msg: >-
          SMF still has a host port published although Docker-network-only
          exposure was selected.
      when: SMF_PUBLISHED_PORT | string | length == 0

    - name: Show reconfigured SMF service state
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --file
          - "{{ SMF_COMPOSE_PATH }}"
          - --file
          - "{{ SMF_COMPOSE_OVERRIDE_PATH }}"
          - ps
        chdir: "{{ SMF_BASE_PATH }}"
      changed_when: false
