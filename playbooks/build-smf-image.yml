# ansible-playbook -i inventory/hosts.yml playbooks/build-smf-image.yml
- name: Build and package the pinned SMF Docker image
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../vars/smf-build.yml"

  vars:
    # The CLI enables this for a clean host. Docker's group membership does
    # not take effect in the Ansible process that just created the group.
    SMF_DOCKER_COMMAND_BECOME: false

  pre_tasks:
    - name: Validate fixed SMF build inputs
      ansible.builtin.assert:
        that:
          - SMF_VERSION == '2.1.7'
          - SMF_SOURCE_REF == 'v2.1.7'
          - SMF_SOURCE_SHA256 == '2c9c0ea7df803ee03ff7755ea3651c680952e264b7c572439902bb18245c06a3'
          - SMF_IMAGE_NAME | length > 0
          - SMF_IMAGE_TAG | length > 0
          - SMF_ARTIFACTS_PATH is match('^/')
          - SMF_IMAGE_TAR is match('^/')
          - SMF_IMAGE_TAR_SHA256 is match('^/')
          - (SMF_IMAGE_TAR | dirname) == SMF_ARTIFACTS_PATH
          - (SMF_IMAGE_TAR_SHA256 | dirname) == SMF_ARTIFACTS_PATH
        fail_msg: >-
          Keep the SMF release, source reference, and source SHA-256 pinned
          together before building an image archive, and keep the archive and
          checksum manifest in the configured artifact directory.

    - name: Verify Docker Engine availability on the Ansible control node
      ansible.builtin.command:
        argv:
          - docker
          - version
      become: "{{ SMF_DOCKER_COMMAND_BECOME | bool }}"
      changed_when: false

    - name: Verify required SMF build inputs
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ SMF_PROJECT_PATH }}/Dockerfile"
        - "{{ SMF_PROJECT_PATH }}/docker/entrypoint.sh"
        - "{{ SMF_PROJECT_PATH }}/templates/docker-compose.smf.yml.j2"
        - "{{ SMF_PROJECT_PATH }}/playbooks/install-smf.yml"
      register: smf_build_input_stats

    - name: Fail when a required SMF build input is absent
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Required SMF build input is absent or is not a regular file: {{ item.item }}"
      loop: "{{ smf_build_input_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

  tasks:
    - name: Build the pinned SMF image
      ansible.builtin.command:
        argv:
          - docker
          - build
          - --pull
          - --build-arg
          - "SMF_VERSION={{ SMF_VERSION }}"
          - --build-arg
          - "SMF_SOURCE_REF={{ SMF_SOURCE_REF }}"
          - --build-arg
          - "SMF_SOURCE_SHA256={{ SMF_SOURCE_SHA256 }}"
          - --tag
          - "{{ SMF_IMAGE_NAME }}:{{ SMF_IMAGE_TAG }}"
          - "{{ SMF_PROJECT_PATH }}"
      become: "{{ SMF_DOCKER_COMMAND_BECOME | bool }}"
      changed_when: true

    - name: Verify the built SMF image
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --entrypoint
          - /bin/sh
          - "{{ SMF_IMAGE_NAME }}:{{ SMF_IMAGE_TAG }}"
          - -ec
          - |
            php -m | grep -qx "mbstring"
            php -m | grep -qx "mysqli"
            php -m | grep -qx "gd"
            php -m | grep -qx "zip"
            php -m | grep -qx "Zend OPcache"
            apache2ctl -t
            test -L /var/www/html/Settings.php
            grep -F "SMF_VERSION" /var/www/html/install.php
            grep -F "{{ SMF_VERSION }}" /var/www/html/install.php
      become: "{{ SMF_DOCKER_COMMAND_BECOME | bool }}"
      changed_when: false

    - name: Create the SMF artifact directory
      ansible.builtin.file:
        path: "{{ SMF_ARTIFACTS_PATH }}"
        state: directory
        mode: "0750"

    - name: Create a temporary SMF image archive
      ansible.builtin.tempfile:
        state: file
        path: "{{ SMF_ARTIFACTS_PATH }}"
        prefix: ".smf-v{{ SMF_VERSION }}-"
        suffix: ".tar"
      register: smf_temporary_image_tar

    - name: Create a temporary SMF image checksum manifest
      ansible.builtin.tempfile:
        state: file
        path: "{{ SMF_ARTIFACTS_PATH }}"
        prefix: ".smf-v{{ SMF_VERSION }}-"
        suffix: ".tar.sha256"
      register: smf_temporary_image_tar_sha256

    - name: Package the verified SMF image
      block:
        - name: Save the SMF image to a temporary archive
          ansible.builtin.command:
            argv:
              - docker
              - image
              - save
              - --output
              - "{{ smf_temporary_image_tar.path }}"
              - "{{ SMF_IMAGE_NAME }}:{{ SMF_IMAGE_TAG }}"
          become: "{{ SMF_DOCKER_COMMAND_BECOME | bool }}"
          changed_when: true

        - name: Calculate the SMF image archive checksum
          ansible.builtin.stat:
            path: "{{ smf_temporary_image_tar.path }}"
            get_checksum: true
            checksum_algorithm: sha256
          register: smf_temporary_image_tar_stat

        - name: Verify the temporary SMF image archive
          ansible.builtin.assert:
            that:
              - smf_temporary_image_tar_stat.stat.exists
              - smf_temporary_image_tar_stat.stat.isreg
              - smf_temporary_image_tar_stat.stat.size | int > 0
              - smf_temporary_image_tar_stat.stat.checksum | length == 64
            fail_msg: "Docker did not create a valid SMF image archive."

        - name: Write the SMF image checksum manifest
          ansible.builtin.copy:
            content: "{{ smf_temporary_image_tar_stat.stat.checksum }}  {{ SMF_IMAGE_TAR | basename }}\n"
            dest: "{{ smf_temporary_image_tar_sha256.path }}"
            mode: "0644"

        - name: Publish the SMF image archive
          ansible.builtin.command:
            argv:
              - mv
              - --
              - "{{ smf_temporary_image_tar.path }}"
              - "{{ SMF_IMAGE_TAR }}"
          changed_when: true

        - name: Publish the SMF image checksum manifest
          ansible.builtin.command:
            argv:
              - mv
              - --
              - "{{ smf_temporary_image_tar_sha256.path }}"
              - "{{ SMF_IMAGE_TAR_SHA256 }}"
          changed_when: true

        - name: Verify the published SMF image archive checksum
          ansible.builtin.command:
            argv:
              - sha256sum
              - --check
              - "{{ SMF_IMAGE_TAR_SHA256 }}"
            chdir: "{{ SMF_ARTIFACTS_PATH }}"
          changed_when: false
      always:
        - name: Remove the temporary SMF image archive
          ansible.builtin.file:
            path: "{{ smf_temporary_image_tar.path }}"
            state: absent
          when: smf_temporary_image_tar.path is defined

        - name: Remove the temporary SMF image checksum manifest
          ansible.builtin.file:
            path: "{{ smf_temporary_image_tar_sha256.path }}"
            state: absent
          when: smf_temporary_image_tar_sha256.path is defined
